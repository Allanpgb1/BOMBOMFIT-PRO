name: Build BOMBOM fit iOS
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build-ios:
    name: Gerar BOMBOM fit para iOS
    runs-on: macos-14
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verificar Flutter
        run: flutter --version
      - name: Instalar dependências Flutter
        run: flutter pub get
      - name: Garantir projeto iOS
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi
      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Validar código
        run: flutter analyze
      - name: Executar testes
        run: flutter test
      # ---------------------------------------------------------
      # IMPORTANTE:
      # A assinatura Apple será adicionada quando os certificados
      # e provisioning profiles estiverem configurados no GitHub.
      # ---------------------------------------------------------
      - name: Gerar IPA sem assinatura
        run: |
          flutter build ipa \
            --release \
            --no-codesign
      - name: Localizar IPA
        run: |
          echo "Arquivos IPA encontrados:"
          find build/ios -name "*.ipa" -print
      - name: Localizar XCARCHIVE
        run: |
          echo "Arquivos XCARCHIVE encontrados:"
          find build/ios -name "*.xcarchive" -print
      - name: Enviar IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: BOMBOM-fit-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Enviar XCARCHIVE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: BOMBOM-fit-iOS-XCARCHIVE
          path: build/ios/archive/*.xcarchive
          if-no-files-found: error