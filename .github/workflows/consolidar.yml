name: Validar BOMBOM fit

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar projeto
        run: flutter analyze

      - name: Executar testes
        run: flutter test

      - name: Verificar estrutura
        run: |
          echo "=== BOMBOM fit ==="
          echo "pubspec.yaml:"
          test -f pubspec.yaml
          echo "lib/:"
          test -d lib
          echo "supabase/:"
          test -d supabase
          echo "Estrutura OK."