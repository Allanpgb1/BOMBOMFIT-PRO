name: Descompactar Bombom Fit

on:
  push:
    branches:
      - principal

permissions:
  contents: write

jobs:
  unpack:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          mkdir -p /tmp/bombomfit
          unzip -o bombom-fit-todos-blocos.zip -d /tmp/bombomfit

          if [ "$(find /tmp/bombomfit -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ]; then
            DIR=$(find /tmp/bombomfit -mindepth 1 -maxdepth 1 -type d)
            cp -R "$DIR"/. .
          else
            cp -R /tmp/bombomfit/. .
          fi

      - name: Salvar arquivos no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Expandir projeto Bombom Fit [skip ci]" || exit 0
          git push
